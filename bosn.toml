[stack.act]
dockerfile = "ci/act.Dockerfile"
family = "mimalloc-pprof-act"
default = true
workdir = "/repo"

[stack.act.mounts]
repo = { source = ".", destination = "/repo" }
docker-socket = { source = "/var/run/docker.sock", destination = "/var/run/docker.sock" }

[stack.act.volumes]
act-cache = { scope = "stack", destination = "/root/.cache/act" }

[task.scaling]
stack = "act"
cmd = "cd /repo && mkdir -p /tmp/act-artifacts && RUNNER_IMAGE=$(docker inspect --format '{{.Config.Image}}' \"$HOSTNAME\") && act workflow_dispatch --workflows .github/workflows/benchmark-scaling.yml --job build --container-architecture linux/amd64 --pull=false --artifact-server-path /tmp/act-artifacts --platform \"ubuntu-24.04=$RUNNER_IMAGE\""
